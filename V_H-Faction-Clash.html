<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>FACTION CLASH — OVERHAUL V2</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#010a03;--g:#00ff41;--g2:#00cc33;--g3:#008822;
  --mut:#1a4422;--border:#0a2e10;--white:#d0ffd8;
  --panel:rgba(3,15,5,0.92);
}
html,body{background:var(--bg);overflow:hidden;width:100%;height:100%;font-family:'Share Tech Mono',monospace;color:var(--white);touch-action:none;}

body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.06) 2px,rgba(0,0,0,0.06) 4px);pointer-events:none;z-index:9999;}

#gameCanvas{position:fixed;inset:0;width:100%;height:100%;}

/* ── HUD ── */
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:10px 14px;pointer-events:none;z-index:100;}
#hud-left{display:flex;flex-direction:column;gap:4px;}
#hud-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;}

.hud-label{font-size:8px;letter-spacing:3px;color:var(--mut);}
.hud-val{font-family:'Orbitron',monospace;font-size:18px;font-weight:900;color:var(--g);text-shadow:0 0 12px var(--g);letter-spacing:2px;}
.hud-timer{font-family:'Orbitron',monospace;font-size:22px;font-weight:900;color:#fff;text-shadow:0 0 12px var(--g);letter-spacing:4px;}
.hud-timer.warn{color:#ff4422;text-shadow:0 0 12px #ff4422;animation:pulse 0.5s infinite alternate;}
@keyframes pulse{from{opacity:1;}to{opacity:0.5;}}

#powerup-strip{position:fixed;top:64px;left:50%;transform:translateX(-50%);display:flex;gap:8px;pointer-events:none;z-index:100;}
.pu-badge{font-size:8px;letter-spacing:2px;padding:3px 10px;border:1px solid;opacity:0;transform:translateY(-8px);transition:opacity 0.3s,transform 0.3s;}
.pu-badge.show{opacity:1;transform:translateY(0);}
.pu-badge.rapid{border-color:#00ffff;color:#00ffff;}
.pu-badge.shield{border-color:#ffaa00;color:#ffaa00;}
.pu-badge.multi{border-color:#ff44ff;color:#ff44ff;}
.pu-badge.slow{border-color:#44ffaa;color:#44ffaa;}
.pu-badge.magnet{border-color:#ff8800;color:#ff8800;}

#scoreboard{position:fixed;right:14px;top:64px;width:160px;background:var(--panel);border:1px solid var(--border);padding:8px;z-index:100;pointer-events:none;}
#scoreboard::before{content:'';position:absolute;top:-1px;right:-1px;width:8px;height:8px;border-top:1px solid var(--g3);border-right:1px solid var(--g3);}
#scoreboard::after{content:'';position:absolute;bottom:-1px;left:-1px;width:8px;height:8px;border-bottom:1px solid var(--g3);border-left:1px solid var(--g3);}
.sb-title{font-size:7px;letter-spacing:2px;color:var(--mut);margin-bottom:6px;border-bottom:1px solid var(--border);padding-bottom:3px;}
.sb-row{display:flex;align-items:center;gap:5px;margin-bottom:4px;font-size:8px;letter-spacing:1px;}
.sb-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.sb-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:rgba(208,255,216,0.7);}
.sb-name.player{color:var(--g);font-weight:bold;}
.sb-score{font-family:'Orbitron',monospace;font-size:9px;font-weight:700;}

/* Controls */
#joystick-zone{position:fixed;bottom:20px;left:20px;width:110px;height:110px;z-index:200;}
#joystick-base{width:110px;height:110px;border-radius:50%;background:rgba(0,255,65,0.04);border:1px solid rgba(0,255,65,0.15);position:absolute;box-shadow:inset 0 0 20px rgba(0,0,0,0.5);}
#joystick-stick{width:36px;height:36px;border-radius:50%;background:rgba(0,255,65,0.15);border:2px solid rgba(0,255,65,0.5);position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);}
#joystick-stick.active{background:rgba(0,255,65,0.3);box-shadow:0 0 20px rgba(0,255,65,0.4);}

#fire-btn{position:fixed;bottom:30px;right:24px;width:72px;height:72px;border-radius:50%;background:rgba(255,50,50,0.1);border:2px solid rgba(255,80,80,0.4);z-index:200;display:flex;align-items:center;justify-content:center;font-family:'Orbitron',monospace;font-size:9px;font-weight:700;letter-spacing:2px;color:rgba(255,120,120,0.8);cursor:pointer;user-select:none;}
#fire-btn:active,#fire-btn.pressed{background:rgba(255,80,80,0.25);border-color:rgba(255,80,80,0.8);color:#ff8888;}

#color-picker{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;z-index:200;}
.color-label{font-size:8px;letter-spacing:2px;color:var(--mut);}
.color-swatch{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;box-shadow:0 0 6px rgba(0,0,0,0.5);}
.color-swatch.active{border-color:#fff;transform:scale(1.25);}

/* Menus */
#setup-screen,#end-screen{
  position:fixed;inset:0;background:rgba(1,10,3,0.97);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:500;gap:12px;padding:20px;overflow-y:auto;
}
#end-screen{display:none;}
.screen-title{font-family:'Orbitron',monospace;font-size:clamp(22px,5vw,38px);font-weight:900;letter-spacing:6px;color:var(--g);text-shadow:0 0 20px var(--g);}
.screen-sub{font-size:10px;letter-spacing:3px;color:var(--mut);margin-bottom:5px;}

.faction-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:440px;width:100%;}
@media(max-width:440px){.faction-grid{grid-template-columns:repeat(2,1fr);}}
.faction-pick{
  background:rgba(3,15,5,0.8);border:1px solid var(--border);
  padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;
  cursor:pointer;transition:all 0.2s;
}
.faction-pick canvas{display:block;}
.faction-pick-name{font-size:7px;letter-spacing:1px;color:var(--mut);text-align:center;}
.faction-pick.active{border-color:var(--g);box-shadow:0 0 14px rgba(0,255,65,0.25);}
.faction-pick.active .faction-pick-name{color:var(--g);}

.config-section{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  background:rgba(3,15,5,0.6);border:1px solid var(--border);
  padding:10px 20px;width:100%;max-width:440px;
}
.config-label{font-size:8px;letter-spacing:2px;color:var(--white);}
.config-control{display:flex;align-items:center;gap:15px;width:100%;justify-content:center;}
.config-slider{
  -webkit-appearance:none;width:65%;height:4px;background:var(--border);
  outline:none;border:1px solid var(--g3);
}
.config-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:12px;height:12px;background:var(--g);cursor:pointer;}
.config-val{font-family:'Orbitron',monospace;font-size:11px;color:var(--g);width:20px;text-align:center;}

/* Difficulty Selector */
.diff-selectors{display:flex;gap:10px;width:100%;max-width:440px;justify-content:center;}
.diff-btn{
  flex:1;background:rgba(3,15,5,0.6);border:1px solid var(--border);
  padding:8px;font-family:'Orbitron',monospace;font-size:9px;letter-spacing:2px;
  color:var(--mut);cursor:pointer;transition:all 0.2s;text-align:center;
}
.diff-btn.active{
  border-color:var(--g);color:var(--g);background:rgba(0,255,65,0.05);
  box-shadow:0 0 10px rgba(0,255,65,0.15);
}

.pcb-btn{
  font-family:'Orbitron',monospace;font-size:11px;font-weight:700;letter-spacing:4px;
  padding:12px 40px;background:transparent;border:1px solid var(--g3);color:var(--g);
  cursor:pointer;position:relative;box-shadow:0 4px 8px rgba(0,0,0,0.5);
  transition:all 0.15s;margin-top:5px;
}
.pcb-btn::before{content:'';position:absolute;top:-1px;right:-1px;width:8px;height:8px;border-top:2px solid var(--g);border-right:2px solid var(--g);}
.pcb-btn::after{content:'';position:absolute;bottom:-1px;left:-1px;width:8px;height:8px;border-bottom:2px solid var(--g);border-left:2px solid var(--g);}
.pcb-btn:hover{border-color:var(--g);box-shadow:0 0 18px rgba(0,255,65,0.2);}

#result-list{display:flex;flex-direction:column;gap:6px;width:280px;}
.result-row{display:flex;align-items:center;gap:10px;font-size:9px;letter-spacing:1px;padding:6px 10px;border:1px solid var(--border);}
.result-row.winner{border-color:var(--g);background:rgba(0,255,65,0.05);}
.result-rank{font-family:'Orbitron',monospace;font-size:11px;font-weight:900;width:20px;color:var(--mut);}
.result-rank.gold{color:#ffdd00;}
.result-name{flex:1;color:rgba(208,255,216,0.8);}
.result-pts{font-family:'Orbitron',monospace;font-size:11px;font-weight:700;color:var(--g);}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>

<div id="hud">
  <div id="hud-left">
    <div class="hud-label">YOUR EXTRACTED ROCKS</div>
    <div class="hud-val" id="hud-score">0</div>
  </div>
  <div style="text-align:center">
    <div class="hud-label">SECTOR TIME</div>
    <div class="hud-timer" id="hud-timer">90</div>
  </div>
  <div id="hud-right">
    <div class="hud-label">TOTAL FIELD ROCKS EXTRACTED</div>
    <div class="hud-val" id="hud-rocks">0</div>
  </div>
</div>
<div id="powerup-strip">
  <div class="pu-badge rapid" id="pu-rapid">⚡ RAPID FIRE</div>
  <div class="pu-badge shield" id="pu-shield">🛡 OVERSHIELD</div>
  <div class="pu-badge multi" id="pu-multi">✦ MULTISHOT</div>
  <div class="pu-badge slow" id="pu-slow">❄ TIME SLOW</div>
  <div class="pu-badge magnet" id="pu-magnet">◎ MAGNET</div>
</div>

<div id="scoreboard">
  <div class="sb-title">ASTEROID KILLS STANDINGS</div>
  <div id="sb-rows"></div>
</div>

<div id="joystick-zone"><div id="joystick-base"></div><div id="joystick-stick"></div></div>
<div id="fire-btn">FIRE</div>
<div id="color-picker"><div class="color-label">HULL COLOR //</div></div>

<div id="setup-screen">
  <div class="screen-title">FACTION CLASH</div>
  <div class="screen-sub">SELECT YOUR ALIGNMENT FACTION</div>
  <div class="faction-grid" id="faction-grid"></div>
  
  <div class="config-section">
    <div class="config-label">RIVAL FACTIONS IN FIELD</div>
    <div class="config-control">
      <input type="range" id="opponent-slider" class="config-slider" min="1" max="7" value="4">
      <div id="opponent-val" class="config-val">4</div>
    </div>
  </div>

  <div class="config-label">AI COMBAT DIFFICULTY LEVEL</div>
  <div class="diff-selectors">
    <div class="diff-btn" id="diff-easy" onclick="setDifficulty('easy')">EASY</div>
    <div class="diff-btn active" id="diff-medium" onclick="setDifficulty('medium')">MEDIUM</div>
    <div class="diff-btn" id="diff-hard" onclick="setDifficulty('hard')">HARD</div>
  </div>

  <div id="setup-colors"></div>
  <button class="pcb-btn" id="launch-btn">LAUNCH SIMULATION</button>
</div>

<div id="end-screen">
  <div class="screen-title" id="end-title">ROUND OVER</div>
  <div class="screen-sub" id="end-sub"></div>
  <div id="result-list"></div>
  <button class="pcb-btn" onclick="resetGame()">RE-ARM & PLAY</button>
</div>

<script>
// ══════════════════════════════════════════════════════════════════════════════
// CONFIG & GAME DICTIONARIES
// ══════════════════════════════════════════════════════════════════════════════
const GAME_DURATION = 90;
const MAX_METEORS = 25; // Continuous asteroid saturation threshold
const METEOR_INTERVAL = 700; 
const POWERUP_INTERVAL = 6500;
const SHIP_COLORS = ['#00ff41','#00ffee','#ff4422','#ffaa00','#ff44ff','#4488ff','#ffffff','#ff8800'];
const COLOR_NAMES = ['GREEN','CYAN','RED','AMBER','PINK','BLUE','WHITE','ORANGE'];

const FACTIONS = [
  {id:'guild',    name:'MINING GUILD',     aiSpeed:1.3, aiAggr:0.7, aiAcc:0.7,
   draw:(ctx,cx,cy,s,col)=>{
    ctx.strokeStyle=col;ctx.lineWidth=1.8;ctx.lineJoin='round';
    ctx.beginPath();ctx.moveTo(cx,cy-s);ctx.lineTo(cx+s*0.45,cy+s*0.6);ctx.lineTo(cx+s*0.15,cy+s*0.35);ctx.lineTo(cx,cy+s*0.5);ctx.lineTo(cx-s*0.15,cy+s*0.35);ctx.lineTo(cx-s*0.45,cy+s*0.6);ctx.closePath();ctx.stroke();
   }},
  {id:'alliance', name:"TRADERS ALLIANCE", aiSpeed:1.1, aiAggr:0.6, aiAcc:0.6,
   draw:(ctx,cx,cy,s,col)=>{
    ctx.strokeStyle=col;ctx.lineWidth=1.8;ctx.lineJoin='round';
    ctx.beginPath();ctx.moveTo(cx,cy-s*0.8);ctx.lineTo(cx+s*0.55,cy-s*0.2);ctx.lineTo(cx+s*0.55,cy+s*0.5);ctx.lineTo(cx+s*0.25,cy+s*0.65);ctx.lineTo(cx-s*0.25,cy+s*0.65);ctx.lineTo(cx-s*0.55,cy+s*0.5);ctx.lineTo(cx-s*0.55,cy-s*0.2);ctx.closePath();ctx.stroke();
   }},
  {id:'techno',   name:'TECHNOCRATS',    aiSpeed:1.5, aiAggr:0.8, aiAcc:0.85,
   draw:(ctx,cx,cy,s,col)=>{
    ctx.strokeStyle=col;ctx.lineWidth=1.8;ctx.lineJoin='round';
    ctx.beginPath();ctx.moveTo(cx,cy-s);ctx.lineTo(cx+s*0.6,cy+s*0.5);ctx.lineTo(cx+s*0.2,cy+s*0.3);ctx.lineTo(cx,cy+s*0.55);ctx.lineTo(cx-s*0.2,cy+s*0.3);ctx.lineTo(cx-s*0.6,cy+s*0.5);ctx.closePath();ctx.stroke();
   }},
  {id:'compact',  name:'IRON COMPACT',     aiSpeed:1.2, aiAggr:0.9, aiAcc:0.8,
   draw:(ctx,cx,cy,s,col)=>{
    ctx.strokeStyle=col;ctx.lineWidth=2;ctx.lineJoin='round';
    ctx.beginPath();ctx.moveTo(cx,cy-s*0.9);ctx.lineTo(cx+s*0.5,cy-s*0.3);ctx.lineTo(cx+s*0.5,cy+s*0.6);ctx.lineTo(cx-s*0.5,cy+s*0.6);ctx.lineTo(cx-s*0.5,cy-s*0.3);ctx.closePath();ctx.stroke();
   }},
  {id:'syndicate',name:'THE SYNDICATE',   aiSpeed:1.7, aiAggr:0.85, aiAcc:0.75,
   draw:(ctx,cx,cy,s,col)=>{
    ctx.strokeStyle=col;ctx.lineWidth=1.5;ctx.lineJoin='round';
    ctx.beginPath();ctx.moveTo(cx,cy-s);ctx.lineTo(cx+s*0.7,cy+s*0.7);ctx.lineTo(cx+s*0.1,cy+s*0.3);ctx.lineTo(cx-s*0.1,cy+s*0.55);ctx.lineTo(cx-s*0.5,cy+s*0.7);ctx.closePath();ctx.stroke();
   }},
  {id:'verdant',  name:'VERDANT CONCORD',  aiSpeed:1.1, aiAggr:0.5, aiAcc:0.65,
   draw:(ctx,cx,cy,s,col)=>{
    ctx.strokeStyle=col;ctx.lineWidth=1.8;ctx.lineJoin='round';
    ctx.beginPath();ctx.moveTo(cx,cy-s);ctx.bezierCurveTo(cx+s*0.5,cy-s*0.2,cx+s*0.45,cy+s*0.6,cx,cy+s*0.5);ctx.bezierCurveTo(cx-s*0.45,cy+s*0.6,cx-s*0.5,cy-s*0.2,cx,cy-s);ctx.stroke();
   }},
  {id:'freefleet',name:'FREE FLEET',       aiSpeed:1.6, aiAggr:0.75, aiAcc:0.7,
   draw:(ctx,cx,cy,s,col)=>{
    ctx.strokeStyle=col;ctx.lineWidth=1.8;ctx.lineJoin='round';
    ctx.beginPath();ctx.moveTo(cx,cy-s);ctx.lineTo(cx+s*0.25,cy-s*0.1);ctx.lineTo(cx+s*0.8,cy+s*0.6);ctx.lineTo(cx+s*0.2,cy+s*0.3);ctx.lineTo(cx,cy+s*0.5);ctx.lineTo(cx-s*0.2,cy+s*0.3);ctx.lineTo(cx-s*0.55,cy+s*0.6);ctx.lineTo(cx-s*0.25,cy-s*0.1);ctx.closePath();ctx.stroke();
   }},
  {id:'conclave', name:'ALIEN CONCLAVE',   aiSpeed:1.4, aiAggr:0.8, aiAcc:0.8,
   draw:(ctx,cx,cy,s,col)=>{
    ctx.strokeStyle=col;ctx.lineWidth=1.5;ctx.lineJoin='round';
    ctx.beginPath();ctx.ellipse(cx,cy,s*0.65,s*0.4,0,0,Math.PI*2);ctx.stroke();
   }},
];

const FACTION_DEFAULT_COLORS=['#ffaa00','#00ffee','#4488ff','#ff4422','#cc44ff','#00ff88','#ffffff','#ff88ff'];

// ══════════════════════════════════════════════════════════════════════════════
// GLOBAL GAME STATE VARIABLES
// ══════════════════════════════════════════════════════════════════════════════
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
let W,H;
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
resize();window.addEventListener('resize',resize);

let gameState='setup'; 
let playerFactionIdx=0;
let playerColor=SHIP_COLORS[0];
let opponentCount=4;
let currentDifficulty='medium';

// Difficulty matrices to inject directly into AI modules
const DIFF_MODIFIERS={
  easy:   { speedScalar:0.8, attackDelay:1.3, accuracy:0.5, avoidHazard:0.4 },
  medium: { speedScalar:1.1, attackDelay:0.9, accuracy:0.75, avoidHazard:0.7 },
  hard:   { speedScalar:1.5, attackDelay:0.5, accuracy:0.95, avoidHazard:0.95 }
};

let ships=[];
let meteors=[];
let bullets=[];
let powerups=[];
let particles=[];
let explosions=[];
let score=0;
let totalRocks=0;
let timeLeft=GAME_DURATION;
let lastTime=0;
let meteorTimer=0;
let powerupTimer=0;
let timerInterval=null;

let activePowerups={rapid:0,shield:0,multi:0,slow:0,magnet:0};
let lastFireTime=0;
const FIRE_COOLDOWN=320;

let joy={active:false,x:0,y:0,dx:0,dy:0,id:-1};
let fireHeld=false;

// ══════════════════════════════════════════════════════════════════════════════
// CONFIG CONTROLS UI SETUP
// ══════════════════════════════════════════════════════════════════════════════
const factionGrid=document.getElementById('faction-grid');
const setupColors=document.getElementById('setup-colors');
const colorPicker=document.getElementById('color-picker');
const slider = document.getElementById('opponent-slider');
const sliderVal = document.getElementById('opponent-val');

slider.addEventListener('input', (e) => {
  opponentCount = parseInt(e.target.value);
  sliderVal.textContent = opponentCount;
});

function setDifficulty(level){
  currentDifficulty=level;
  document.querySelectorAll('.diff-btn').forEach(btn=>btn.classList.remove('active'));
  document.getElementById('diff-'+level).classList.add('active');
}

FACTIONS.forEach((f,i)=>{
  const div=document.createElement('div');
  div.className='faction-pick'+(i===0?' active':'');
  div.dataset.idx=i;
  const c=document.createElement('canvas');
  c.width=55;c.height=55;
  const fctx=c.getContext('2d');
  f.draw(fctx,27,27,14,FACTION_DEFAULT_COLORS[i]);
  div.appendChild(c);
  const nm=document.createElement('div');
  nm.className='faction-pick-name';
  nm.textContent=f.name;
  div.appendChild(nm);
  div.addEventListener('click',()=>{
    document.querySelectorAll('.faction-pick').forEach(el=>el.classList.remove('active'));
    div.classList.add('active');
    playerFactionIdx=i;
  });
  factionGrid.appendChild(div);
});

[setupColors,colorPicker].forEach((container)=>{
  SHIP_COLORS.forEach((col,i)=>{
    const sw=document.createElement('div');
    sw.className='color-swatch'+(i===0?' active':'');
    sw.style.background=col;
    sw.addEventListener('click',()=>{
      playerColor=col;
      document.querySelectorAll('.color-swatch').forEach(el=>el.classList.remove('active'));
      document.querySelectorAll(`.color-swatch`).forEach(el=>{if(el.style.background===col||el.style.backgroundColor===col)el.classList.add('active');});
    });
    container.appendChild(sw);
  });
});

document.getElementById('launch-btn').addEventListener('click',startGame);

// ══════════════════════════════════════════════════════════════════════════════
// SAFE POSITION SPAWN GENERATOR
// ══════════════════════════════════════════════════════════════════════════════
function getSafeSpawnCoords(minDistance=150){
  let attempts=0;
  while(attempts<100){
    const rx=Math.random()*(W-100)+50;
    const ry=Math.random()*(H-100)+50;
    let safe=true;
    for(let s of ships){
      if(s && !s.dead){
        if(Math.hypot(s.x-rx, s.y-ry)<minDistance){
          safe=false; break;
        }
      }
    }
    if(safe) return {x:rx, y:ry};
    attempts++;
  }
  return {x:Math.random()*W, y:Math.random()*H};
}

// ══════════════════════════════════════════════════════════════════════════════
// SHIP COMPONENT (With Rule Awareness & Intelligent Target Logic)
// ══════════════════════════════════════════════════════════════════════════════
class Ship{
  constructor(faction,color,isPlayer,idx){
    this.faction=faction;
    this.color=color;
    this.isPlayer=isPlayer;
    this.idx=idx;
    this.x=Math.random()*W;
    this.y=Math.random()*H;
    this.vx=0;this.vy=0;
    this.angle=Math.random()*Math.PI*2;
    this.size=isPlayer?18:15;
    this.score=0;
    this.shield=100;
    this.maxShield=100;
    this.shieldFlash=0;
    this.overshield=false;
    this.overshieldTimer=0;
    this.fireCooldown=0;
    
    // AI Target Matrices
    this.aiObjectiveTarget=null;
    this.aiThreatTarget=null;
    this.aiDecisionTimer=0;
    
    this.name=isPlayer?'YOU':faction.name;
    this.trailPoints=[];
    this.dead=false;
    this.respawnTimer=0;
    this.speed=isPlayer?3.8:faction.aiSpeed*2.0;
    this.bumpCooldown=0;
    this.timeSinceLastHit=0;
  }

  update(dt,slow){
    const spdMod=slow?0.4:1;
    if(this.dead){
      this.respawnTimer-=dt;
      if(this.respawnTimer<=0){
        this.dead=false;
        this.shield=this.maxShield;
        const safePos=getSafeSpawnCoords(180);
        this.x=safePos.x; this.y=safePos.y;
        this.vx=0; this.vy=0;
      }
      return;
    }
    if(this.bumpCooldown>0)this.bumpCooldown-=dt;
    if(this.overshieldTimer>0){this.overshieldTimer-=dt;this.overshield=true;}else{this.overshield=false;}
    if(this.shieldFlash>0)this.shieldFlash-=dt;
    if(this.fireCooldown>0)this.fireCooldown-=dt;
    
    this.timeSinceLastHit+=dt;
    if(this.timeSinceLastHit>2400 && this.shield<this.maxShield){
      this.shield=Math.min(this.maxShield,this.shield+0.09*dt);
    }

    this.trailPoints.unshift({x:this.x,y:this.y,a:0.45});
    if(this.trailPoints.length>8)this.trailPoints.pop();
    this.trailPoints.forEach(p=>p.a*=0.82);

    // ── INTELLIGENT RULE-AWARE AI ENGINE ──
    if(!this.isPlayer){
      const diff=DIFF_MODIFIERS[currentDifficulty];
      this.aiDecisionTimer-=dt;
      
      // Periodically refresh objective analysis
      if(this.aiDecisionTimer<=0){
        this.aiDecisionTimer=250+Math.random()*300;
        
        // 1. Scan for closest high-value target (Powerups prioritized over Rocks)
        let bestTarget=null, bestDist=999999;
        
        powerups.forEach(p=>{
          const d=Math.hypot(p.x-this.x, p.y-this.y);
          if(d<bestDist){bestDist=d; bestTarget={obj:p, type:'powerup'};}
        });
        
        meteors.forEach(m=>{
          const d=Math.hypot(m.x-this.x, m.y-this.y);
          // Only weigh rocks if they are closer than powerups
          if(d<bestDist && d<600){bestDist=d; bestTarget={obj:m, type:'meteor'};}
        });
        
        this.aiObjectiveTarget=bestTarget;

        // 2. Scan for defensive threats (Self-defense mechanism)
        let activeThreat=null, threatDist=280;
        ships.forEach(otherShip=>{
          if(otherShip!==this && !otherShip.dead){
            const d=Math.hypot(otherShip.x-this.x, otherShip.y-this.y);
            if(d<threatDist){
              threatDist=d; activeThreat=otherShip;
            }
          }
        });
        this.aiThreatTarget=activeThreat;
      }

      // Execute steering behaviors
      let targetX=W/2, targetY=H/2;
      let hasTarget=false;

      if(this.aiObjectiveTarget && this.aiObjectiveTarget.obj && !this.aiObjectiveTarget.obj.dead){
        targetX=this.aiObjectiveTarget.obj.x;
        targetY=this.aiObjectiveTarget.obj.y;
        hasTarget=true;
      } else if(this.aiThreatTarget){
        targetX=this.aiThreatTarget.x;
        targetY=this.aiThreatTarget.y;
        hasTarget=true;
      }

      // Edge prevention vector
      if(this.x<80) {this.vx+=0.4; targetX=W/2;}
      if(this.x>W-80){this.vx-=0.4; targetX=W/2;}
      if(this.y<80) {this.vy+=0.4; targetY=H/2;}
      if(this.y>H-80){this.vy-=0.4; targetY=H/2;}

      if(hasTarget){
        const desiredAngle=Math.atan2(targetY-this.y, targetX-this.x);
        const diffAng=((desiredAngle-this.angle+Math.PI*3)%(Math.PI*2))-Math.PI;
        this.angle+=diffAng*0.12*diff.accuracy;
        
        const enginePower=this.speed*diff.speedScalar*0.05;
        this.vx+=Math.cos(this.angle)*enginePower*spdMod;
        this.vy+=Math.sin(this.angle)*enginePower*spdMod;

        // Combat routines: Shoot at meteors or threat vectors inside range
        if(this.fireCooldown<=0){
          const rangeCheck=Math.hypot(targetY-this.y, targetX-this.x);
          if(rangeCheck<320 && Math.random()<0.3){
            this.fire();
            this.fireCooldown=FIRE_COOLDOWN*diff.attackDelay*(1.0+Math.random()*0.5);
          }
        }
      } else {
        // Safe wandering loop if arena sector clears out
        this.vx+=Math.cos(this.angle)*0.06*spdMod;
        this.vy+=Math.sin(this.angle)*0.06*spdMod;
      }
    }

    // Physics Update
    const damp=0.90;
    this.vx*=damp;this.vy*=damp;
    const maxSpd=this.speed*diffModifiers().speedScalar*spdMod;
    const currentSpeed=Math.hypot(this.vx,this.vy);
    if(currentSpeed>maxSpd){this.vx=this.vx/currentSpeed*maxSpd;this.vy=this.vy/currentSpeed*maxSpd;}

    this.x+=this.vx;this.y+=this.vy;
    
    // Screen Wrap Limits
    if(this.x<-30)this.x=W+20;if(this.x>W+30)this.x=-20;
    if(this.y<-30)this.y=H+20;if(this.y>H+30)this.y=-20;
  }

  fire(){
    const spread=activePowerups.multi>0&&this.isPlayer?[-0.22,0,0.22]:[0];
    const rapid=activePowerups.rapid>0&&this.isPlayer;
    spread.forEach(offset=>{
      bullets.push(new Bullet(this.x,this.y,this.angle+offset,this.color,this,rapid));
    });
    for(let i=0;i<3;i++){
      const a=this.angle+(Math.random()-0.5)*0.6;
      particles.push({x:this.x,y:this.y,vx:Math.cos(a)*4,vy:Math.sin(a)*4,life:0.25,maxLife:0.25,col:this.color,r:1.5});
    }
  }

  takeDamage(amt){
    if(this.overshield){amt*=0.12;}
    this.shield-=amt;
    this.shieldFlash=180;
    this.timeSinceLastHit=0;
    if(this.shield<=0){
      this.shield=0;
      this.dead=true;
      this.respawnTimer=3000;
      spawnExplosion(this.x,this.y,this.color,30);
    }
  }

  bump(other){
    if(this.bumpCooldown>0||other.bumpCooldown>0)return;
    const dx=other.x-this.x,dy=other.y-this.y;
    const dist=Math.hypot(dx,dy);
    if(dist<(this.size+other.size)*1.1){
      const nx=dx/dist,ny=dy/dist;
      const relV=(this.vx-other.vx)*nx+(this.vy-other.vy)*ny;
      if(relV>0){
        const imp=relV*1.2;
        this.vx-=nx*imp;this.vy-=ny*imp;
        other.vx+=nx*imp;other.vy+=ny*imp;
        this.takeDamage(8);other.takeDamage(8);
        this.bumpCooldown=200;other.bumpCooldown=200;
      }
    }
  }

  draw(){
    if(this.dead)return;
    ctx.save();
    ctx.translate(this.x,this.y);
    ctx.rotate(this.angle+Math.PI/2);

    this.trailPoints.forEach((p,i)=>{
      ctx.globalAlpha=p.a*(1-i/8);
      ctx.fillStyle=this.color;
      ctx.beginPath();ctx.arc(0,this.size*0.4,this.size*0.2,0,Math.PI*2);ctx.fill();
    });
    ctx.globalAlpha=1;

    // Shield status rings
    const shieldAlpha=this.shieldFlash>0?0.8:0.2;
    const shieldCol=this.overshield?'#ffaa00':this.color;
    ctx.strokeStyle=shieldCol;
    ctx.lineWidth=this.overshield?2:1;
    ctx.globalAlpha=shieldAlpha*(this.shield/this.maxShield);
    ctx.beginPath();ctx.arc(0,0,this.size*1.5,0,Math.PI*2);ctx.stroke();
    ctx.globalAlpha=1;

    ctx.shadowColor=this.color;ctx.shadowBlur=5;
    this.faction.draw(ctx,0,0,this.size,this.color);
    ctx.restore();

    // HUD Indicators below nodes
    const bw=26,bh=3;
    const bx=this.x-bw/2,by=this.y-this.size*2;
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(bx,by,bw,bh);
    ctx.fillStyle=this.shield>40?this.color:'#ff3311';
    ctx.fillRect(bx,by,bw*(this.shield/this.maxShield),bh);
  }
}

function diffModifiers(){
  return DIFF_MODIFIERS[currentDifficulty] || DIFF_MODIFIERS.medium;
}

// ══════════════════════════════════════════════════════════════════════════════
// BULLET ENGINE MODULE
// ══════════════════════════════════════════════════════════════════════════════
class Bullet{
  constructor(x,y,angle,color,owner,rapid){
    this.x=x;this.y=y;
    this.spd=rapid?10.0:8.0;
    this.vx=Math.cos(angle)*this.spd;
    this.vy=Math.sin(angle)*this.spd;
    this.color=color;
    this.owner=owner;
    this.life=1.1;
    this.r=2.5;
    this.dead=false;
  }
  update(dt,slow){
    const s=slow?0.4:1;
    this.x+=this.vx*s;this.y+=this.vy*s;
    this.life-=dt/1000;
    if(this.life<=0)this.dead=true;
  }
  draw(){
    ctx.save();
    ctx.strokeStyle=this.color;
    ctx.lineWidth=this.r;
    ctx.beginPath();ctx.moveTo(this.x,this.y);
    ctx.lineTo(this.x-this.vx*2.2,this.y-this.vy*2.2);
    ctx.stroke();
    ctx.restore();
  }
}

// ══════════════════════════════════════════════════════════════════════════════
// SAFE-DISTRIBUTED METEOR COMPONENT
// ══════════════════════════════════════════════════════════════════════════════
class Meteor{
  constructor(initialFieldSpawn=false){
    this.dead=false;
    this.flash=0;
    this.pts=[];
    
    if(initialFieldSpawn){
      // Distribute evenly throughout active zones cleanly on startup
      const coords=getSafeSpawnCoords(160);
      this.x=coords.x;
      this.y=coords.y;
    } else {
      // Spawn standard border entry nodes cleanly
      const side=Math.floor(Math.random()*4);
      if(side===0){this.x=Math.random()*W;this.y=-30;}
      else if(side===1){this.x=W+30;this.y=Math.random()*H;}
      else if(side===2){this.x=Math.random()*W;this.y=H+30;}
      else{this.x=-30;this.y=Math.random()*H;}
    }

    this.r=14+Math.random()*22;
    this.maxHp=Math.ceil(this.r/8);
    this.hp=this.maxHp;
    
    const targetX=W/2+(Math.random()-0.5)*W*0.6;
    const targetY=H/2+(Math.random()-0.5)*H*0.6;
    const speed=0.4+Math.random()*1.1;
    const heading=Math.atan2(targetY-this.y, targetX-this.x);
    this.vx=Math.cos(heading)*speed;
    this.vy=Math.sin(heading)*speed;
    this.rot=Math.random()*Math.PI;
    this.rotSpd=(Math.random()-0.5)*0.03;

    const sides=8+Math.floor(Math.random()*4);
    for(let i=0;i<sides;i++){
      const ang=i*Math.PI*2/sides;
      const dist=this.r*(0.7+Math.random()*0.3);
      this.pts.push([Math.cos(ang)*dist,Math.sin(ang)*dist]);
    }
  }

  update(dt,slow){
    const s=slow?0.35:1;
    this.rot+=this.rotSpd*s;
    this.x+=this.vx*s;this.y+=this.vy*s;
    if(this.flash>0)this.flash-=dt;
    
    // Bounds collection cleanup tags
    if(this.x<-150||this.x>W+150||this.y<-150||this.y>H+150)this.dead=true;
  }

  hit(dmg){
    this.hp-=dmg;this.flash=140;
    if(this.hp<=0){this.dead=true;return true;}
    return false;
  }

  draw(){
    ctx.save();
    ctx.translate(this.x,this.y);ctx.rotate(this.rot);
    const fl=this.flash>0?Math.min(1,this.flash/140):0;
    ctx.strokeStyle=`rgba(${Math.floor(170+85*fl)},${Math.floor(125+70*fl)},${Math.floor(70+30*fl)},1)`;
    ctx.lineWidth=1.5;
    ctx.fillStyle=`rgba(40,28,16,${0.7+fl*0.3})`;
    ctx.beginPath();
    this.pts.forEach((p,i)=>i===0?ctx.moveTo(p[0],p[1]):ctx.lineTo(p[0],p[1]));
    ctx.closePath();ctx.fill();ctx.stroke();
    ctx.restore();
  }
}

// ══════════════════════════════════════════════════════════════════════════════
// POWERUP COMPONENT
// ══════════════════════════════════════════════════════════════════════════════
const PU_TYPES=[
  {id:'rapid',col:'#00ffff',label:'⚡',duration:8000},
  {id:'shield',col:'#ffaa00',label:'🛡',duration:10000},
  {id:'multi',col:'#ff44ff',label:'✦',duration:7000},
  {id:'slow',col:'#44ffaa',label:'❄',duration:6000},
  {id:'magnet',col:'#ff8800',label:'◎',duration:9000},
];
class Powerup{
  constructor(){
    this.type=PU_TYPES[Math.floor(Math.random()*PU_TYPES.length)];
    const coords=getSafeSpawnCoords(100);
    this.x=coords.x;this.y=coords.y;
    this.r=14;
    this.dead=false;
    this.pulse=0;
    this.vx=(Math.random()-0.5)*0.5;
    this.vy=(Math.random()-0.5)*0.5;
  }
  update(dt){
    this.pulse+=dt*0.005;
    this.x+=this.vx;this.y+=this.vy;
    if(this.x<40||this.x>W-40)this.vx*=-1;
    if(this.y<40||this.y>H-40)this.vy*=-1;
  }
  draw(){
    const sc=1+Math.sin(this.pulse)*0.12;
    ctx.save();ctx.translate(this.x,this.y);ctx.scale(sc,sc);
    ctx.strokeStyle=this.type.col;ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(0,0,this.r,0,Math.PI*2);ctx.stroke();
    ctx.font=`13px serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle=this.type.col;ctx.fillText(this.type.label,0,1);
    ctx.restore();
  }
}

// ══════════════════════════════════════════════════════════════════════════════
// PARTICLE SUB SYSTEMS
// ══════════════════════════════════════════════════════════════════════════════
function spawnExplosion(x,y,col,count){
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2;const spd=1+Math.random()*4;
    particles.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,life:0.5+Math.random()*0.5,maxLife:1.0,col,r:1+Math.random()*2.5});
  }
}
function spawnMeteorBits(x,y,r){
  for(let i=0;i<10;i++){
    const a=Math.random()*Math.PI*2;const sp=1+Math.random()*3;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:0.7,maxLife:0.7,col:`rgba(190,140,75,0.8)`,r:1+Math.random()*r*0.2});
  }
}

const stars=Array.from({length:150},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.2+0.2,a:Math.random()*0.4+0.1}));
function drawBackground(){
  ctx.fillStyle='rgba(1,10,3,0.25)';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(0,255,65,0.03)';ctx.lineWidth=0.5;
  const step=60;
  for(let x=0;x<W;x+=step){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=step){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  stars.forEach(s=>{
    ctx.fillStyle=`rgba(0,255,65,${s.a})`;
    ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);ctx.fill();
  });
}

    <div class="sb-row">

      <div class="sb-name${s.isPlayer?' player':''}">${s.isPlayer?'YOU':s.faction.id.toUpperCase()}</div>
      <div class="sb-score" style="color:${s.color}">${s.score}</div>
    </div>`).join('');
  
  document.getElementById('hud-score').textContent=ships.find(s=>s.isPlayer)?.score||0;
  document.getElementById('hud-rocks').textContent=totalRocks;
}

function updatePowerupHUD(){
  Object.keys(activePowerups).forEach(id=>{
    const el=document.getElementById('pu-'+id);

  });
}

// ══════════════════════════════════════════════════════════════════════════════
// ENGINE INITIALIZATION & START ROUTINE
// ══════════════════════════════════════════════════════════════════════════════
function startGame(){
  document.getElementById('setup-screen').style.display='none';
  gameState='playing';
  ships=[]; meteors=[]; bullets=[]; powerups=[]; particles=[]; explosions=[];
  score=0; totalRocks=0; timeLeft=GAME_DURATION;
  meteorTimer=0; powerupTimer=0;
  Object.keys(activePowerups).forEach(k=>activePowerups[k]=0);

  // Initialize Player
  const player=new Ship(FACTIONS[playerFactionIdx],playerColor,true,0);
  player.x=W/2; player.y=H/2;
  ships.push(player);

  // Pool & Spawn exact count of Requested Competitor AI Bots
  let pool=[];
  FACTIONS.forEach((f,i)=>{ if(i!==playerFactionIdx) pool.push(i); });
  pool.sort(()=>Math.random()-0.5);

  for(let i=0; i<opponentCount; i++){
    let fIdx=pool[i%pool.length];
    const compBot=new Ship(FACTIONS[fIdx], FACTION_DEFAULT_COLORS[fIdx], false, fIdx);
    // Disperse safely
    const coords=getSafeSpawnCoords(150);
    compBot.x=coords.x; compBot.y=coords.y;
    ships.push(compBot);
  }

  // ── REFACTOR CRITICAL: INSTANT INITAL FIELD ASTEROID SATURATION ──
  // Populates 14 baseline asteroids scattered randomly across active coordinates safely immediately
  for(let k=0; k<14; k++){
    meteors.push(new Meteor(true)); 
  }

  if(timerInterval)clearInterval(timerInterval);
  timerInterval=setInterval(()=>{
    if(gameState!=='playing')return;
    timeLeft--;
    const el=document.getElementById('hud-timer');
    el.textContent=timeLeft;
    el.className='hud-timer'+(timeLeft<=10?' warn':'');
    if(timeLeft<=0) endGame();
  },1000);

  lastTime=performance.now();
  requestAnimationFrame(loop);
}

// ══════════════════════════════════════════════════════════════════════════════
// MAIN TIMESTEP EXECUTION LOOP
// ══════════════════════════════════════════════════════════════════════════════
function loop(now){
  if(gameState!=='playing')return;
  const dt=Math.min(now-lastTime,50);
  lastTime=now;
  const slow=activePowerups.slow>0;

  meteorTimer+=dt; powerupTimer+=dt;
  if(meteorTimer>METEOR_INTERVAL && meteors.length<MAX_METEORS){
    meteorTimer=0; meteors.push(new Meteor(false));
  }
  if(powerupTimer>POWERUP_INTERVAL){
    powerupTimer=0; if(powerups.length<4) powerups.push(new Powerup());
  }

  Object.keys(activePowerups).forEach(k=>{if(activePowerups[k]>0){activePowerups[k]-=dt; if(activePowerups[k]<0)activePowerups[k]=0;}});
  updatePowerupHUD();

  ships.forEach(s=>s.update(dt,slow));
  for(let i=0;i<ships.length;i++)for(let j=i+1;j<ships.length;j++)ships[i].bump(ships[j]);

  // Read human control systems
  const player=ships.find(s=>s.isPlayer);
  if(player&&!player.dead&&joy.active){
    const jMag=Math.hypot(joy.dx,joy.dy);
    if(jMag>0.1){
      player.angle=Math.atan2(joy.dy,joy.dx);
      const th=Math.min(jMag/50,1)*0.24;
      player.vx+=Math.cos(player.angle)*th*(slow?0.4:1);
      player.vy+=Math.sin(player.angle)*th*(slow?0.4:1);
    }
  }

  if(activePowerups.magnet>0&&player&&!player.dead){
    meteors.forEach(m=>{
      const dx=player.x-m.x,dy=player.y-m.y; const d=Math.hypot(dx,dy);
      if(d<220&&d>1){m.vx+=dx/d*0.35;m.vy+=dy/d*0.35;}
    });
  }

  bullets.forEach(b=>b.update(dt,slow));
  bullets=bullets.filter(b=>!b.dead);

  // Bullet vs Asteroid Checking
  bullets.forEach(b=>{
    meteors.forEach(m=>{
      if(m.dead)return;
      if(Math.hypot(b.x-m.x,b.y-m.y)<m.r+b.r){
        b.dead=true;
        if(m.hit(1)){
          spawnMeteorBits(m.x,m.y,m.r);
          totalRocks++;
          if(b.owner){
            b.owner.score++;
            if(b.owner.isPlayer)score++;
          }
          particles.push({x:m.x,y:m.y-10,vx:0,vy:-0.5,life:1.0,maxLife:1.0,col:b.owner?b.owner.color:'#fff',text:'+1',isText:true});
        }
      }
    });
  });

  // Bullet vs Ships
  bullets.forEach(b=>{
    ships.forEach(s=>{
      if(s===b.owner||s.dead)return;
      if(Math.hypot(b.x-s.x,b.y-s.y)<s.size*1.3){
        b.dead=true;
        s.takeDamage(14); // Requires multiple hits to breach shield vectors
      }
    });
  });

  // Ship vs High Threat Asteroid Field Impacts
  ships.forEach(s => {
    if(s.dead) return;
    meteors.forEach(m => {
      if(m.dead) return;
      if(Math.hypot(s.x-m.x, s.y-m.y)<m.r+s.size*0.85) {
        m.dead=true;
        spawnMeteorBits(m.x, m.y, m.r);
        if(s.shield>0){
          s.takeDamage(s.shield); // Hit 1: Strip whole shields
          particles.push({x:s.x, y:s.y-12, vx:0, vy:-0.5, life:1.3, maxLife:1.3, col:'#ffaa00', text:'SHIELD COLLAPSE', isText:true});
        } else {
          s.takeDamage(100); // Hit 2: Instant respawn hull break
          particles.push({x:s.x, y:s.y-12, vx:0, vy:-0.5, life:1.3, maxLife:1.3, col:'#ff2222', text:'HULL CRUSHED', isText:true});
        }
      }
    });
  });

  // Competitor Ship/Player vs Powerups
  ships.forEach(s=>{
    if(s.dead)return;
    powerups.forEach(pu=>{
      if(pu.dead)return;
      if(Math.hypot(s.x-pu.x,s.y-pu.y)<s.size+pu.r){
        pu.dead=true;
        spawnExplosion(pu.x,pu.y,pu.type.col,12);
        if(s.isPlayer){
          activePowerups[pu.type.id]=pu.type.duration;
          if(pu.type.id==='shield')player.overshieldTimer=pu.type.duration;
        } else {
          // AI gains localized modifiers matching powerup profiles
          if(pu.type.id==='shield'){s.overshieldTimer=pu.type.duration; s.shield=s.maxShield;}
          if(pu.type.id==='rapid') s.fireCooldown=0;
        }
      }
    });
  });
  
  powerups=powerups.filter(p=>!p.dead);
  meteors=meteors.filter(m=>!m.dead);

  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life-=dt/1000;});
  particles=particles.filter(p=>p.life>0);

  // Canvas Renders
  drawBackground();
  meteors.forEach(m=>m.draw());
  powerups.forEach(p=>p.draw());
  bullets.forEach(b=>b.draw());
  ships.forEach(s=>s.draw());

  particles.forEach(p=>{
    ctx.save(); ctx.globalAlpha=p.life/p.maxLife;
    if(p.isText){
      ctx.fillStyle=p.col;ctx.font='bold 9px Orbitron';ctx.textAlign='center';
      ctx.fillText(p.text,p.x,p.y);
    } else {
      ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
  });

  if(player&&!player.dead&&fireHeld){
    const now2=performance.now();
    const cd=activePowerups.rapid>0?110:FIRE_COOLDOWN;
    if(now2-lastFireTime>cd){lastFireTime=now2;player.fire();}
  }

  updateScoreboard();
  requestAnimationFrame(loop);
}

// ══════════════════════════════════════════════════════════════════════════════
// SCREEN COMPLETED RENDER PROTOCOLS
// ══════════════════════════════════════════════════════════════════════════════
function endGame(){
  gameState='over';
  clearInterval(timerInterval);
  const sorted=[...ships].sort((a,b)=>b.score-a.score);
  const player=ships.find(s=>s.isPlayer);
  const rank=sorted.findIndex(s=>s.isPlayer)+1;
  
  document.getElementById('end-screen').style.display='flex';
  document.getElementById('end-title').textContent=rank===1?'VICTORY ACHIEVED':'ROUND OVER';
  document.getElementById('end-sub').textContent=`RANK LEVEL #${rank} — YOU COLLECTED ${player.score} ASTEROID CORES`;
  
  const rl=document.getElementById('result-list');
  rl.innerHTML=sorted.map((s,i)=>`
    <div class="result-row${i===0?' winner':''}">
      <div class="result-rank${i===0?' gold':''}">#${i+1}</div>
      <div class="result-name">${s.isPlayer?'YOU — '+s.name:s.name}</div>
      <div class="result-pts" style="color:${s.color}">${s.score}</div>
    </div>`).join('');
}

function resetGame(){
  document.getElementById('end-screen').style.display='none';
  document.getElementById('setup-screen').style.display='flex';
  gameState='setup';
  ctx.clearRect(0,0,W,H);
}

// ══════════════════════════════════════════════════════════════════════════════
// DEVICE INPUT MONITOR ROUTINES
// ══════════════════════════════════════════════════════════════════════════════
const jZone=document.getElementById('joystick-zone');
const jStick=document.getElementById('joystick-stick');
const JR=50;

function joyStart(cx,cy){joy.active=true; joy.x=cx;joy.y=cy; jStick.classList.add('active');}
function joyMove(cx,cy){
  if(!joy.active)return;
  const rect=jZone.getBoundingClientRect();
  const ox=rect.left+55,oy=rect.top+55;
  let dx=cx-ox,dy=cy-oy; const mag=Math.hypot(dx,dy);
  if(mag>JR){dx=dx/mag*JR;dy=dy/mag*JR;}
  joy.dx=dx;joy.dy=dy;
  jStick.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;
}
function joyEnd(){
  joy.active=false;joy.dx=0;joy.dy=0;
  jStick.style.transform='translate(-50%,-50%)'; jStick.classList.remove('active');
}

jZone.addEventListener('touchstart',e=>{e.preventDefault();const t=e.changedTouches[0];joy.id=t.identifier;joyStart(t.clientX,t.clientY);},{passive:false});
jZone.addEventListener('touchmove',e=>{e.preventDefault();const t=[...e.changedTouches].find(t=>t.identifier===joy.id);if(t)joyMove(t.clientX,t.clientY);},{passive:false});
jZone.addEventListener('touchend',e=>{e.preventDefault();joyEnd();},{passive:false});
jZone.addEventListener('mousedown',e=>joyStart(e.clientX,e.clientY));
window.addEventListener('mousemove',e=>{if(joy.active)joyMove(e.clientX,e.clientY);});
window.addEventListener('mouseup',()=>{if(joy.active)joyEnd();});

const keys={};
window.addEventListener('keydown',e=>keys[e.key]=true);
window.addEventListener('keyup',e=>keys[e.key]=false);
setInterval(()=>{
  if(gameState!=='playing')return;
  const player=ships.find(s=>s.isPlayer);
  if(!player||player.dead)return;
  const dx=(keys['ArrowRight']||keys['d']?1:0)-(keys['ArrowLeft']||keys['a']?1:0);
  const dy=(keys['ArrowDown']||keys['s']?1:0)-(keys['ArrowUp']||keys['w']?1:0);
  if(dx!==0||dy!==0){
    player.angle=Math.atan2(dy,dx);
    player.vx+=Math.cos(player.angle)*0.25;
    player.vy+=Math.sin(player.angle)*0.25;
  }
  if((keys[' ']||keys['Enter'])&&performance.now()-lastFireTime>FIRE_COOLDOWN){
    lastFireTime=performance.now();player.fire();
  }
},16);

const fireBtn=document.getElementById('fire-btn');
fireBtn.addEventListener('touchstart',e=>{e.preventDefault();fireHeld=true;fireBtn.classList.add('pressed');},{passive:false});
fireBtn.addEventListener('touchend',e=>{e.preventDefault();fireHeld=false;fireBtn.classList.remove('pressed');},{passive:false});
fireBtn.addEventListener('mousedown',()=>{fireHeld=true;fireBtn.classList.add('pressed');});
window.addEventListener('mouseup',()=>{fireHeld=false;fireBtn.classList.remove('pressed');});
canvas.addEventListener('click',e=>{
  if(gameState!=='playing')return;
  const player=ships.find(s=>s.isPlayer);
  if(!player||player.dead)return;
  const now=performance.now();
  if(now-lastFireTime>FIRE_COOLDOWN){
    lastFireTime=now; player.angle=Math.atan2(e.clientY-player.y,e.clientX-player.x); player.fire();
  }
});
</script>
